plugins {
    id 'java'
	// For source code formatting
	id "com.diffplug.spotless" version "7.2.1"
    // Download task
    id "de.undercouch.download" version "5.6.0"
	// Shadow
	id "com.gradleup.shadow" version "9.0.2"
}

/**
 * Project Properties
 */
sourceCompatibility = jdkVersion
targetCompatibility = jdkVersion
ext {
	buildID = System.getenv( 'BUILD_ID' ) ?: '0'
	branch = System.getenv( 'BRANCH' ) ?: 'development'
}

if ( branch == 'development' ) {
    // If the branch is 'development', ensure the version ends with '-snapshot'
    // This replaces any existing prerelease identifier with '-snapshot'
    version = version.contains('-') ? version.replaceAll(/-.*/, '-snapshot') : "${version}-snapshot"
	boxlangVersion = boxlangVersion.contains('-') ? boxlangVersion.replaceAll(/-.*/, '-snapshot') : "${boxlangVersion}-snapshot"
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
	// Includes BoxLang + SLF4J + AWS Lambda Core
	implementation 'io.boxlang:boxlang-aws-lambda:1.4.0'

    // Testing Dependencies
	testImplementation 'com.amazonaws:aws-lambda-java-core:1.3.0'
    testImplementation 'org.slf4j:slf4j-nop:2.0.17'

	// Testing Frameworks
    testImplementation "org.junit.jupiter:junit-jupiter:5.+"
	testImplementation "org.mockito:mockito-core:5.+"
	testImplementation "com.google.truth:truth:1.+"
	// Explicitly declare the JUnit platform launcher (to avoid deprecation)
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

java {
}

compileJava {
	// Compiler Options
	options.incremental = true
	options.encoding = 'UTF-8'
	options.debug()
}

compileTestJava {
}

test {
    useJUnitPlatform()
    testLogging {
		showStandardStreams = true
	}
}

jar {
    archiveVersion =  "${version}"
 	manifest {
	   attributes 'Description': 'My BoxLang AWS Lambda Runtime'
    }
}
shadowJar {
	mergeServiceFiles()
    destinationDirectory = file( "build/distributions" )
}
build.finalizedBy( shadowJar )

/**
 * Build the Lambda zip file for deployment on AWS
 */
task buildLambdaZip( type: Zip ) {
	archiveFileName = "${project.name}-${version}.zip"

	// Add Lambda.bx to the root of the ZIP
	from( 'src/main/bx' ) {
		into ''
	}

	// Add boxlang.json to the root of the ZIP
    from( 'src/resources/boxlang.json' ) {
        into '' // Ensure it's placed in the root
    }

	// Add BoxLang Modules
    from( 'src/resources/boxlang_modules/' ) {
        into 'boxlang_modules/'
    }

	// Include dependencies inside the `lib/` folder
	into( 'lib' ) {
		// All the Jars in the src/test/resources/libs directory
		from 'src/test/resources/libs'
		from shadowJar.outputs.files
	}
}
shadowJar.finalizedBy( buildLambdaZip )

/**
 * Task to download the latest jar from https://ortus-temp.s3.amazonaws.com/jericho/libs/boxlang-1.0.0.jar
 * You can also move this to maven if you want.
 */
task downloadBoxLang( type: Download ) {
	dependsOn( 'processTestResources' )
	// Create the destination directory
	doFirst {
		file( "src/resources/libs" ).mkdirs()
	}

    // Configure the URL of the file to download
	src "https://s3.amazonaws.com/downloads.ortussolutions.com/ortussolutions/boxlang-runtimes/boxlang-aws-lambda/${boxlangVersion}/boxlang-aws-lambda-${boxlangVersion}.jar"

	// Specify the destination directory for the downloaded file
    dest "src/resources/libs/boxlang-aws-lambda-${boxlangVersion}.jar"
    overwrite true
    onlyIfModified false
}

/**
 * Project Wide Helper function
 * This is not a task, but a reusable UDF
 */
project.ext.bumpVersion = { boolean major = false, boolean minor = false, boolean patch = false ->

	def propertiesFile = file( './gradle.properties' );
	def properties = new Properties();

	properties.load( propertiesFile.newDataInputStream() )
	def versionTarget = major ? 0 : minor ? 1 : 2

	def currentVersion = properties.getProperty( 'version' )
	def versionParts = currentVersion.split( '\\.' )
	def newPathVersion = versionParts[ versionTarget ].toInteger() + 1
	def newVersion = '';

	if( patch ){
		newVersion = "${versionParts[ 0 ]}.${versionParts[ 1 ]}.${newPathVersion}"
	} else if( minor ){
		newVersion = "${versionParts[ 0 ]}.${newPathVersion}.0"
	} else if( major ){
		newVersion = "${newPathVersion}.0.0"
	}

	properties.setProperty( 'version', newVersion )
	properties.store( propertiesFile.newWriter(), null )

	println "Bumped version from ${currentVersion} to ${newVersion}"
}
/**
 * Bump the major version number
 */
task bumpMajorVersion {
	doLast{
		bumpVersion( true )
	}
}

/**
 * Bump the minor version number
 */
task bumpMinorVersion {
	doLast{
		bumpVersion( false, true )
	}
}

/**
 * Bump the patch version number
 */
task bumpPatchVersion {
	doLast{
		bumpVersion( false, false, true )
	}
}
